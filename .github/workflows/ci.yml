name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Selfcheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: bin/godot
          key: godot-4.4-stable-linux-x86_64

      - name: Install Godot
        run: ./tools/install_godot.sh

      - name: Run checks
        run: ./tools/check.sh
